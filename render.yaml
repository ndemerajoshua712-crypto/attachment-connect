databases:
  - name: attachment-connect-db
    databaseName: attachment_connect
    user: attachment_connect
    plan: free

services:
  - type: web
    name: attachment-connect-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: attachment-connect-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
